<!-- THEME: Moldie Blue (built via retheme.py from Void) -->
<rml>
    <head>
        <title>Chat Box</title>

        <link type="text/template" href="../templates/window-box.html" />

        <style>
            body
            {
                width: 405dp;
                height: 340dp;
                min-width: 340dp;
                min-height: 150dp;
                margin-top: -3dp;
                margin-left: 3dp;
                padding-bottom: 64dp;
            }

            scrollbarvertical
            {
                margin-right: -20dp;
            }

            body scrollbarvertical {
                display: none;
            }

            body:hover scrollbarvertical {
                display: inline-block;
            }

            body #resizer {
                display: none;
            }

            body:hover #resizer {
                display: inline-block;
            }

            body #mover {
                display: none;
            }

            body:hover #mover {
                display: inline-block;
            }

            #resizer {
                position: absolute;
                top: 2dp;
                right: 2dp;
            }

            #mover {
                position: absolute;
                top: 2dp;
                right: 27dp;
            }

            handle {
                cursor: drag;
            }

            percentage-handle {
                position: relative;
                left: 0dp;
                top: -8dp;
                width: 100%;
                height: 10dp;
                display: inline-block;
                cursor: drag;
            }

            #percentage-handle-icon {
                display: none;
                position: absolute;
                top: -8dp;
                left: 50%;
                width: 24dp;
                height: 20dp;
                decorator: tiled-vertical(scrollbar-button-t, scrollbar-button-c, scrollbar-button-b);
            }

            percentage-handle:hover >  #percentage-handle-icon {
                display: inline-block;
            }

            #virtual-messages
            {
                display: block;
                word-break: break-word;
                font-effect: outline(1dp black);
                overflow: hidden scroll;
                decorator: horizontal-gradient(rgba(22, 34, 64, 175) rgba(14, 22, 44, 115));
                padding-left: 15dp;
                height: 65%;
            }

            #virtual-system
            {
                display: block;
                word-break: break-word;
                font-effect: outline(1dp black);
                overflow: hidden scroll;
                decorator: horizontal-gradient(rgba(22, 34, 64, 175) rgba(14, 22, 44, 115));
                padding-left: 15dp;
                height: 35%;
            }

            #chat-separator {
                width: 100%;
                height: 1dp;
            }

            select#category
            {
                width: 80dp;
            }

            select#category selectvalue
            {
                display: none;
            }

            select#category selectbox
            {
                width: 120dp;
            }

            span#category-text
            {
                position: absolute;
                left: 10dp;
                padding-top: 4dp;
                pointer-events: none;
            }

            #input-container
            {
                decorator: horizontal-gradient(rgba(22, 34, 64, 175) rgba(14, 22, 44, 115));
                height: 64dp;
            }

            #input-tab-container
            {
                font-effect: outline(1dp black);
                height: 34dp;
                overflow: hidden auto;
            }

            #input-tab-container > button
            {
                min-width: 5dp;
            }

            .window
            {
                width: 100%;
                height: 100%;
            }

            tab.default
            {
                min-width: 5dp;
            }

            .chat-message
            {
                margin: 0dp 0dp;
            }

            .chat-message-from:hover
            {
                text-decoration: underline;
            }

            .chat-message-link:hover
            {
                text-decoration: underline;
            }

            .timestamp {
                color: #8494b0;
                font-effect: glow(1dp 2dp #8494b0), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-chat {
                color: #eef5ff;
                font-effect: glow(1dp 3dp #eef5ff), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-shout {
                color: #ff6b82;
                font-effect: glow(1dp 2dp #ff6b82), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-party {
                color: #8be9fd;
                font-effect: glow(1dp 2dp #8be9fd), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-clan {
                color: #2e7de6;
                font-effect: glow(1dp 2dp #2e7de6), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-clan-notification {
                color: #2e7de6;
                font-effect: glow(1dp 2dp #2e7de6), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-trade {
                color: #6ee7b7;
                font-effect: glow(1dp 2dp #6ee7b7), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-whisper {
                color: #ff9bcf;
                font-effect: glow(1dp 2dp #ff9bcf), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-social-notification {
                color: #ff9bcf;
                font-effect: glow(1dp 2dp #ff9bcf), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-notice {
                color: #f5c98a;
                font-effect: glow(1dp 2dp #f5c98a), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-system {
                color: #d8e8ff;
                font-effect: glow(1dp 2dp #d8e8ff), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-error {
                color: #ff4d5e;
                font-effect: glow(1dp 2dp #ff4d5e), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-quest {
                color: #9be0f5;
                font-effect: glow(1dp 2dp #9be0f5), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-quest-reward {
                color: #96bef5;
                font-effect: glow(1dp 2dp #96bef5), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-group {
                color: #a9d2ff;
                font-effect: glow(1dp 2dp #a9d2ff), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-message-group-leader {
                color: #5b8fd4;
                font-effect: glow(1dp 2dp #5b8fd4), outline(1dp rgba(8, 13, 26, 220));
            }

            .chat-name-gm
            {
                color: rgb(125, 171, 252);
            }

            .chat-name-cm
            {
                color: rgb(255, 128, 85);
            }

            .chat-name-dev
            {
                color: rgb(169, 210, 255);
            }

            .chat-name-mod
            {
                color: rgb(255, 159, 65);
            }

            .chat-name-event
            {
                color: rgb(0, 153, 77);
            }
        </style>
    </head>

    <body id="game-chat-box">
        <div style="height: 100%; width:100%;" data-model="chat-box">
            <virtual-list-box id="virtual-system" data-if="show_system_tab"></virtual-list-box>

            <div id="chat-separator" data-if="show_system_tab">
                <percentage-handle property="height" primary_target="virtual-system" secondary_target="virtual-messages" min="10" max="90">
                    <span id="percentage-handle-icon"></span>
                </percentage-handle>
            </div>

            <virtual-list-box id="virtual-messages"></virtual-list-box>

            <div id="input-container">
                <div id="input-tab-container">
                    <button class="default" data-for="tabs" data-class-selected="tab_index == it_index" data-event-click="tab_index = it_index; current_tab_changed()" onclick="tab_button_clicked">{{it.name}}</button>
                </div>
                <div style="height: 30dp; width: 100%; margin-left: 2dp;">
                    <div style="display: flex; flex-direction: row; height: 28dp; width:100%; align-items: center;">
                        <div style="flex: none; width: 100dp;">
                            <span id="category-text">Chat</span>
                            <select id="category" data-event-change="chat_input_category_changed()" data-value="chat_input_category" style="tab-index: none">
                                <option value="0" selected  onclick="chat_input_category_clicked">Chat /s</option>
                                <option value="1">Whisper /w</option>
                                <option value="2">Shout /sh</option>
                                <option value="3">Party /p</option>
                                <option value="4">Clan /c</option>
                                <option value="5">Group /g</option>
                                <option value="6">Trade /t</option>
                            </select>
                        </div>
                        <input id="whisper_name" type="text" maxlength="20" data-if="chat_input_category == 1" style="margin-right:3dp; tab-index: auto; width: 110dp;" />
                        <input id="input_text" type="text" style="flex: 2; margin-right:3dp; tab-index: auto" data-attrif-disabled="chat_blocked" maxlength="250" retains-focus />
                    </div>
                </div>
            </div>
        </div>

        <handle id="mover" class="button-move" move_target="#document"></handle>
        <handle id="resizer" class="button-resize" size_target="#document"></handle>
    </body>
</rml>
