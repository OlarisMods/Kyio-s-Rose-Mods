<rml>
    <head>
        <title>Chat Box</title>

        <link type="text/template" href="../templates/window-box.html" />

        <style>
            body
            {
                width: 405dp;
                height: 340dp;
                min-width: 340dp;
                min-height: 150dp;
                margin-top: -3dp;
                margin-left: 3dp;
                padding-bottom: 64dp;
            }

            scrollbarvertical
            {
                margin-right: -20dp;
            }

            body scrollbarvertical {
                display: none;
            }

            body:hover scrollbarvertical {
                display: inline-block;
            }

            body #resizer {
                display: none;
            }

            body:hover #resizer {
                display: inline-block;
            }

            body #chat-settings,
            body #mover {
                display: none;
            }

            body:hover #chat-settings,
            body:hover #mover {
                display: inline-block;
            }

            #resizer {
                position: absolute;
                top: 2dp;
                right: 2dp;
            }

            #mover {
                position: absolute;
                top: 2dp;
                right: 27dp;
            }

            #chat-settings {
                position: absolute;
                top: 2dp;
                right: 52dp;
            }

            handle {
                cursor: drag;
            }

            percentage-handle {
                position: relative;
                left: 0dp;
                top: -8dp;
                width: 100%;
                height: 10dp;
                display: inline-block;
                cursor: drag;
            }

            #percentage-handle-icon {
                display: none;
                position: absolute;
                top: -8dp;
                left: 50%;
                width: 24dp;
                height: 20dp;
                decorator: tiled-vertical(scrollbar-button-t, scrollbar-button-c, scrollbar-button-b);
            }

            percentage-handle:hover >  #percentage-handle-icon {
                display: inline-block;
            }

            #virtual-messages
            {
                display: block;
                word-break: break-word;
                font-effect: outline(1dp #000000);
                overflow: hidden scroll;
                decorator: horizontal-gradient(rgba(25, 29, 29, 140) rgba(19, 23, 23, 40));
                padding-left: 15dp;
                height: 65%;
            }

            #virtual-system
            {
                display: block;
                word-break: break-word;
                font-effect: outline(1dp #000000);
                overflow: hidden scroll;
                decorator: horizontal-gradient(rgba(25, 29, 29, 140) rgba(19, 23, 23, 40));
                padding-left: 15dp;
                height: 35%;
            }

            #chat-separator {
                width: 100%;
                height: 1dp;
            }

            select#category
            {
                width: 80dp;
            }

            select#category selectvalue
            {
                display: none;
            }

            select#category selectbox
            {
                width: 120dp;
            }

            span#category-text
            {
                position: absolute;
                left: 10dp;
                padding-top: 4dp;
                pointer-events: none;
            }

            #input-container
            {
                decorator: horizontal-gradient(rgba(25, 29, 29, 140) rgba(19, 23, 23, 40));
                height: 64dp;
            }

            #input-tab-container
            {
                font-effect: outline(1dp #000000);
                height: 34dp;
                overflow: hidden auto;
            }

            #input-tab-container > button
            {
                min-width: 5dp;
            }

            .window
            {
                width: 100%;
                height: 100%;
            }

            tab.default
            {
                min-width: 5dp;
            }

            .chat-message
            {
                margin: 0dp 0dp;
            }

            .chat-message-from:hover
            {
                text-decoration: underline;
            }

            .chat-message-link:hover
            {
                text-decoration: underline;
            }

            .timestamp
            {
                color: #8ca19e;
            }

            .chat-message-chat
            {
                color: #e4f2f0;
            }

            .chat-message-shout
            {
                color: #ff8a73;
            }

            .chat-message-party
            {
                color: #8be9fd;
            }

            .chat-message-clan
            {
                color: #92d1c9;
            }

            .chat-message-clan-notification
            {
                color: #92d1c9;
            }

            .chat-message-trade
            {
                color: #33c4ad;
            }

            .chat-message-whisper
            {
                color: #ff8a73;
            }

            .chat-message-social-notification
            {
                color: #ff8a73;
            }

            .chat-message-notice
            {
                color: #ebaa6a;
            }

            .chat-message-system
            {
                color: #daedeb;
            }

            .chat-message-error
            {
                color: #f24e53;
            }

            .chat-message-quest
            {
                color: #9be0f5;
            }

            .chat-message-quest-reward
            {
                color: #c5e6e1;
            }

            .chat-message-group
            {
                color: #96bee8;
            }

            .chat-message-group-leader
            {
                color: #5a84c4;
            }

            .chat-name-gm
            {
                color: rgb(197, 230, 225);
            }

            .chat-name-cm
            {
                color: rgb(235, 150, 95);
            }

            .chat-name-dev
            {
                color: rgb(150, 190, 240);
            }

            .chat-name-mod
            {
                color: rgb(255, 159, 65);
            }

            .chat-name-event
            {
                color: rgb(0, 153, 77);
            }
        </style>
    </head>

    <body id="game-chat-box">
        <div style="height: 100%; width:100%;" data-model="chat-box">
            <virtual-list-box id="virtual-system" data-if="show_system_tab"></virtual-list-box>

            <div id="chat-separator" data-if="show_system_tab">
                <percentage-handle property="height" primary_target="virtual-system" secondary_target="virtual-messages" min="10" max="90">
                    <span id="percentage-handle-icon"></span>
                </percentage-handle>
            </div>

            <virtual-list-box id="virtual-messages"></virtual-list-box>

            <div id="input-container">
                <div id="input-tab-container">
                    <button class="default" data-for="tabs" data-class-selected="tab_index == it_index" data-event-click="tab_index = it_index; current_tab_changed()" onclick="tab_button_clicked">{{it.name}}</button>
                </div>
                <div style="height: 30dp; width: 100%; margin-left: 2dp;">
                    <div style="display: flex; flex-direction: row; height: 28dp; width:100%; align-items: center;">
                        <div style="flex: none; width: 100dp;">
                            <span id="category-text">Chat</span>
                            <select id="category" data-event-change="chat_input_category_changed()" data-value="chat_input_category" style="tab-index: none">
                                <option value="0" selected  onclick="chat_input_category_clicked">Chat /s</option>
                                <option value="1">Whisper /w</option>
                                <option value="2">Shout /sh</option>
                                <option value="3">Party /p</option>
                                <option value="4">Clan /c</option>
                                <option value="5">Group /g</option>
                                <option value="6">Trade /t</option>
                            </select>
                        </div>
                        <input id="whisper_name" type="text" maxlength="20" data-if="chat_input_category == 1" style="margin-right:3dp; tab-index: auto; width: 110dp;" />
                        <input id="input_text" type="text" style="flex: 2; margin-right:3dp; tab-index: auto" data-attrif-disabled="chat_blocked" maxlength="250" retains-focus />
                    </div>
                </div>
            </div>
        </div>

        <button id="chat-settings" class="settings" onclick="chat_settings" tooltip="Chat settings"></button>
        <handle id="mover" class="button-move" move_target="#document"></handle>
        <handle id="resizer" class="button-resize" size_target="#document"></handle>
    </body>
</rml>
